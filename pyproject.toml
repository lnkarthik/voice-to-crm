[project]
name = "voice-to-crm"
version = "0.1.0"
description = "Turn sales voice memos into Salesforce Leads and Tasks, with measured extraction accuracy"
readme = "README.md"
authors = [
    { name = "Lakshmi Narasimha", email = "lnkarthik.vs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
v2c = "voice_to_crm.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
markers = ["live: calls real Claude/Whisper/Salesforce"]
addopts = "-m 'not live'"
